name: Deploy Hexo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with deployment URL
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER="${OWNER,,}"
          REPOSITORY_NAME_LOWER="${REPOSITORY_NAME,,}"

          if [[ -f source/CNAME ]]; then
            CUSTOM_DOMAIN="$(tr -d '\r\n ' < source/CNAME)"
            SITE_URL="https://${CUSTOM_DOMAIN}"
            SITE_ROOT="/"
          elif [[ "${REPOSITORY_NAME_LOWER}" == "${OWNER_LOWER}.github.io" ]]; then
            SITE_URL="https://${OWNER_LOWER}.github.io"
            SITE_ROOT="/"
          else
            SITE_URL="https://${OWNER_LOWER}.github.io/${REPOSITORY_NAME}"
            SITE_ROOT="/${REPOSITORY_NAME}/"
          fi

          printf 'url: %s\nroot: %s\n' "${SITE_URL}" "${SITE_ROOT}" > _config.deploy.yml
          npx hexo clean
          npx hexo generate --config _config.yml,_config.deploy.yml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
