- id: quantum-two-way-time-transfer
  title: "Quantum Two-Way Time Transfer (QTWTT)"
  description: "This research investigates high-precision time-offset estimation and stability analysis in quantum two-way time transfer. It develops correlation-based processing, coincidence-peak readout, and data-analysis methods, together with optical sampling, to support reliable synchronization measurements."
  questions:
    - "Correlation-based time-offset estimation"
    - "Coincidence-peak localization and readout"
    - "Stability analysis of synchronization data"
