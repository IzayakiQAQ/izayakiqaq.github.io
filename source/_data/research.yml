- id: dispersion-compensation-for-qt-wtt
  title: "Algorithmic Dispersion Compensation for QTWTT"
  description: "This direction studies compensation algorithms for dispersion-broadened coincidence peaks in QTWTT. It combines physics-constrained estimation, template matching, and data-driven models to improve time-center readout and stability assessment under broadened-peak conditions."
  questions:
    - "Dispersion-induced peak broadening"
    - "Physics-constrained compensation"
    - "PSF and time-center readout modeling"
