# Site
title: "{{AUTHOR_NAME}} — Academic Homepage"
subtitle: "Ph.D. Student"
description: "{{RESEARCH_SUMMARY}}"
keywords: academic homepage, research, publications, projects, blog
author: "{{AUTHOR_NAME}}"
language: en
timezone: Asia/Shanghai

# URLs. GitHub Actions supplies deployment-specific overrides automatically.
url: https://izayakiqaq.github.io
root: /
permalink: blog/:year/:month/:day/:title/
permalink_defaults: {}
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directories
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - files/*.pdf

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# Markdown, code highlighting, and math-friendly rendering
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  enable: false

# Lists and taxonomies
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
category_map:
  Learning Notes: learning-notes
  Research Thoughts: research-thoughts
  Technology: technology
  Life: life
tag_map: {}

# Search and RSS
search:
  path: search.xml
  field: all
  content: true
  format: html
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true

theme: butterfly

deploy: {}
